services:
  postgres:
    image: postgres:16-alpine
    container_name: gymve-postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-gymve}
      GYMVE_APP_DB_USER: ${GYMVE_APP_DB_USER:-gymve_app}
      GYMVE_APP_DB_PASSWORD: ${GYMVE_APP_DB_PASSWORD:?Define GYMVE_APP_DB_PASSWORD en .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gymve_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/01-app-user.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-gymve}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    profiles: [proxy]
    image: caddy:2-alpine
    container_name: gymve-caddy
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gymve_pgdata:
    name: gymve_pgdata
